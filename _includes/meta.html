<header>
  <h1><a href="{{ include.post.url | relative_url }}">{{ include.post.title }}</a></h1>
  {% if include.post.description %}<p class="post-caption">{{ include.post.description }}</p>{% endif %}
  {% if include.post.start_date %}
    <div class="post-date">
      {{ include.post.start_date }}{% if include.post.end_date %} &ndash; {{ include.post.end_date }}{% endif %}
    </div>
  {% endif %}
</header>
