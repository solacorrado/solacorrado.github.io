---
title: "Projects"
layout: default
---

<main>
  <header><h1>{{ page.title }}</h1></header>
  <div class="project-grid">
    {% for post in site.posts %}
      <a class="project-card" href="{{ post.url | relative_url }}">
        {% if post.image %}
          <img src="{{ post.image | relative_url }}" alt="{{ post.title }}">
        {% endif %}
        <h3>{{ post.title }}</h3>
      </a>
    {% endfor %}
  </div>
</main>
